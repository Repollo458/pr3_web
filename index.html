<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuitarBuilder Pro — Acceso</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        /* =========================================
           ESTILOS ESPECÍFICOS PARA AUTH
           ========================================= */
        .auth-wrapper {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--borde);
            border-radius: var(--radius-lg);
            padding: 36px 32px 28px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.4);
            position: relative;
            overflow: visible;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 20px;
            bottom: 20px;
            left: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--oro) 0%, transparent 100%);
            border-radius: 0 2px 2px 0;
            opacity: 0.6;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .auth-header h2 {
            font-family: var(--fuente-titulo);
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--oro);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .auth-header p {
            font-size: 0.85rem;
            color: var(--txt-sec);
        }

        .auth-toggle {
            display: flex;
            gap: 0;
            margin-bottom: 28px;
            border: 1.5px solid var(--borde);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .auth-toggle button {
            flex: 1;
            background: transparent;
            border: none;
            padding: 12px;
            font-family: var(--fuente-titulo);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--txt-sec);
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .auth-toggle button.active {
            background: var(--oro-suave);
            color: var(--oro);
            box-shadow: inset 0 0 0 1px var(--oro);
        }

        .auth-toggle button:not(.active):hover {
            color: var(--txt);
            background: var(--bg-card-hover);
        }

        .auth-form {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .auth-form.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .campo-auth {
            margin-bottom: 20px;
        }

        .campo-auth label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--txt-sec);
            margin-bottom: 8px;
        }

        .campo-auth input[type="text"],
        .campo-auth input[type="email"],
        .campo-auth input[type="password"] {
            width: 100%;
            background: var(--bg-input);
            border: 1.5px solid var(--borde);
            border-radius: var(--radius);
            padding: 12px 16px;
            color: var(--txt);
            font-family: var(--fuente-texto);
            font-size: 0.92rem;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .campo-auth input:focus {
            outline: none;
            border-color: var(--oro);
            box-shadow: 0 0 0 3px var(--oro-suave);
        }

        .campo-auth input::placeholder {
            color: var(--txt-dim);
        }

        .campo-auth small {
            display: block;
            font-size: 0.72rem;
            color: var(--txt-dim);
            margin-top: 6px;
        }

        .fila-doble {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        @media (max-width: 480px) {
            .fila-doble { grid-template-columns: 1fr; }
            .auth-card { padding: 28px 22px 22px; }
        }

        .opcion-check.terminos {
            margin-bottom: 24px;
            font-size: 0.82rem;
        }

        .opcion-check.terminos a {
            color: var(--oro);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-color 0.25s;
        }

        .opcion-check.terminos a:hover {
            border-bottom-color: var(--oro);
        }

        .acciones-auth {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-primario.auth-full {
            width: 100%;
            text-align: center;
        }

        .mensaje-error {
            display: none;
            background: var(--rojo-suave);
            border: 1px solid var(--rojo);
            color: #ff9999;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            margin-bottom: 18px;
        }

        .mensaje-error.visible {
            display: block;
        }

        .mensaje-exito {
            display: none;
            background: rgba(34, 155, 34, 0.15);
            border: 1px solid #2a9b2a;
            color: #7dd87d;
            padding: 10px 14px;
            border-radius: var(--radius);
            font-size: 0.85rem;
            margin-bottom: 18px;
        }

        .mensaje-exito.visible {
            display: block;
        }

        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--oro);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>
        <h1>GuitarBuilder Pro</h1>
        <p>Taller de guitarras personalizadas</p>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">

            <div class="auth-header">
                <h2 id="auth-titulo">Iniciar Sesión</h2>
                <p id="auth-subtitulo">Accede a tu taller personal</p>
            </div>

            <div class="auth-toggle">
                <button type="button" id="tab-login" class="active" onclick="mostrarForm('login')">Entrar</button>
                <button type="button" id="tab-register" onclick="mostrarForm('register')">Crear Cuenta</button>
            </div>

            <!-- FORMULARIO LOGIN -->
            <form id="form-login" class="auth-form active" onsubmit="enviarLogin(event)" novalidate>
                <div id="error-login" class="mensaje-error"></div>
                <div id="exito-login" class="mensaje-exito"></div>

                <div class="campo-auth">
                    <label for="login_email">Email</label>
                    <input type="email" id="login_email" name="email" placeholder="tu@email.com" required autocomplete="email">
                </div>

                <div class="campo-auth">
                    <label for="login_password">Contraseña</label>
                    <input type="password" id="login_password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <label class="opcion-check" style="margin-bottom: 22px;">
                    <input type="checkbox" name="recordar">
                    <span>Mantener sesión iniciada</span>
                </label>

                <div class="acciones-auth">
                    <button type="submit" class="btn-primario auth-full" id="btn-login">
                        Acceder al Taller
                    </button>
                    <div class="spinner" id="spinner-login"></div>
                </div>
            </form>

            <!-- FORMULARIO REGISTRO -->
            <form id="form-register" class="auth-form" onsubmit="enviarRegistro(event)" novalidate>
                <div id="error-register" class="mensaje-error"></div>
                <div id="exito-register" class="mensaje-exito"></div>

                <div class="fila-doble">
                    <div class="campo-auth">
                        <label for="reg_nombre">Nombre</label>
                        <input type="text" id="reg_nombre" name="nombre" placeholder="Jorge" required autocomplete="given-name">
                    </div>
                    <div class="campo-auth">
                        <label for="reg_apellido">Apellido</label>
                        <input type="text" id="reg_apellido" name="apellido" placeholder="García" required autocomplete="family-name">
                    </div>
                </div>

                <div class="campo-auth">
                    <label for="reg_usuario">Nombre de usuario</label>
                    <input type="text" id="reg_usuario" name="usuario" placeholder="jorge_guitar" required autocomplete="username">
                    <small>Será tu identificador público en el taller.</small>
                </div>

                <div class="campo-auth">
                    <label for="reg_email">Email</label>
                    <input type="email" id="reg_email" name="email" placeholder="jorge@email.com" required autocomplete="email">
                </div>

                <div class="fila-doble">
                    <div class="campo-auth">
                        <label for="reg_password">Contraseña</label>
                        <input type="password" id="reg_password" name="password" placeholder="Mín. 8 caracteres" required minlength="8" autocomplete="new-password">
                    </div>
                    <div class="campo-auth">
                        <label for="reg_password2">Repetir contraseña</label>
                        <input type="password" id="reg_password2" name="password2" placeholder="Igual que arriba" required autocomplete="new-password">
                    </div>
                </div>

                <label class="opcion-check terminos">
                    <input type="checkbox" name="terminos" id="reg_terminos" required>
                    <span>Acepto los <a href="#">términos de uso</a> y la <a href="#">política de privacidad</a>.</span>
                </label>

                <div class="acciones-auth">
                    <button type="submit" class="btn-primario auth-full" id="btn-register">
                        Crear Usuario
                    </button>
                    <div class="spinner" id="spinner-register"></div>
                </div>
            </form>

        </div>
    </main>

    <footer>
        <p>GuitarBuilder Pro &copy; 2026 | Configurador v2.0</p>
    </footer>

    <script>
        // =========================================
        // URL DE TU SERVIDOR FLASK
        // =========================================
        const API_URL = "https://pr3-web.onrender.com";
        // =========================================
        // ↑↑↑ CAMBIA SI FLASK ESTÁ EN OTRO PUERTO/SERVIDOR ↑↑↑
        // =========================================

        const formLogin    = document.getElementById('form-login');
        const formRegister = document.getElementById('form-register');
        const tabLogin     = document.getElementById('tab-login');
        const tabRegister  = document.getElementById('tab-register');
        const titulo       = document.getElementById('auth-titulo');
        const subtitulo    = document.getElementById('auth-subtitulo');

        function mostrarForm(modo) {
            // Limpiar mensajes al cambiar de pestaña
            document.querySelectorAll('.mensaje-error, .mensaje-exito').forEach(el => el.classList.remove('visible'));
            
            if (modo === 'login') {
                formLogin.classList.add('active');
                formRegister.classList.remove('active');
                tabLogin.classList.add('active');
                tabRegister.classList.remove('active');
                titulo.textContent = 'Iniciar Sesión';
                subtitulo.textContent = 'Accede a tu taller personal';
            } else {
                formLogin.classList.remove('active');
                formRegister.classList.add('active');
                tabLogin.classList.remove('active');
                tabRegister.classList.add('active');
                titulo.textContent = 'Crear Cuenta';
                subtitulo.textContent = 'Únete al taller y guarda tus diseños';
            }
        }

        // =========================================
        // ENVIAR REGISTRO A FLASK
        // =========================================
        async function enviarRegistro(e) {
            e.preventDefault();
            
            const errBox = document.getElementById('error-register');
            const exitoBox = document.getElementById('exito-register');
            const spinner = document.getElementById('spinner-register');
            const btn = document.getElementById('btn-register');
            
            // Validación cliente
            const p1 = document.getElementById('reg_password').value;
            const p2 = document.getElementById('reg_password2').value;
            const terminos = document.getElementById('reg_terminos').checked;
            
            if (p1 !== p2) {
                errBox.textContent = 'Las contraseñas no coinciden.';
                errBox.classList.add('visible');
                return;
            }
            if (!terminos) {
                errBox.textContent = 'Debes aceptar los términos para continuar.';
                errBox.classList.add('visible');
                return;
            }
            
            errBox.classList.remove('visible');
            exitoBox.classList.remove('visible');
            
            // Preparar datos
            const datos = {
                usuario: document.getElementById('reg_usuario').value,
                email: document.getElementById('reg_email').value,
                password: p1,
                nombre: document.getElementById('reg_nombre').value,
                apellido: document.getElementById('reg_apellido').value
            };
            
            // Mostrar spinner
            btn.style.display = 'none';
            spinner.style.display = 'block';
            
            try {
                const respuesta = await fetch(`${API_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                
                const resultado = await respuesta.json();
                
                if (!respuesta.ok) {
                    errBox.textContent = resultado.error || 'Error en el registro';
                    errBox.classList.add('visible');
                } else {
                    exitoBox.textContent = '¡Registro exitoso! Redirigiendo al login...';
                    exitoBox.classList.add('visible');
                    setTimeout(() => mostrarForm('login'), 1500);
                }
                
            } catch (error) {
                errBox.textContent = 'No se pudo conectar con el servidor. ¿Está Flask ejecutándose?';
                errBox.classList.add('visible');
            } finally {
                btn.style.display = 'block';
                spinner.style.display = 'none';
            }
        }

        // =========================================
        // ENVIAR LOGIN A FLASK + REDIRECCIÓN
        // =========================================
        async function enviarLogin(e) {
            e.preventDefault();
            
            const errBox = document.getElementById('error-login');
            const exitoBox = document.getElementById('exito-login');
            const spinner = document.getElementById('spinner-login');
            const btn = document.getElementById('btn-login');
            
            const email = document.getElementById('login_email').value.trim();
            const password = document.getElementById('login_password').value;
            
            if (!email || !password) {
                errBox.textContent = 'Completa todos los campos.';
                errBox.classList.add('visible');
                return;
            }
            
            errBox.classList.remove('visible');
            exitoBox.classList.remove('visible');
            
            const datos = { email, password };
            
            btn.style.display = 'none';
            spinner.style.display = 'block';
            
            try {
                const respuesta = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(datos)
                });
                
                const resultado = await respuesta.json();
                
                if (!respuesta.ok) {
                    errBox.textContent = resultado.error || 'Error en el login';
                    errBox.classList.add('visible');
                } else {
                    if (resultado.success) {
                        // 1. PRIMERO guardamos los datos en localStorage (por si falla la sesión)
                        localStorage.setItem('guitarUser', resultado.user.nombre || resultado.user.username);
                        localStorage.setItem('guitarUserId', resultado.user.id);
                        
                        // 2. Mostramos mensaje de éxito
                        exitoBox.textContent = '¡Login exitoso! Redirigiendo...';
                        exitoBox.classList.add('visible');
                        
                        // 3. Redirigimos de forma segura
                        const destino = resultado.redirect || 'formulario_personalizacion_guitarra.html';
                        setTimeout(() => {
                            window.location.href = destino;
                        }, 800);
                    }
                }
                
            } catch (error) {
                errBox.textContent = 'No se pudo conectar con el servidor. ¿Está Flask ejecutándose en ' + API_URL + '?';
                errBox.classList.add('visible');
            } finally {
                btn.style.display = 'block';
                spinner.style.display = 'none';
            }
        }
    </script>
</body>
</html>
